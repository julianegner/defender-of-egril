name: Auto-close linked issues on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues linked to this PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Use GitHub's own closingIssuesReferences — the same engine
            // that powers the "Development / linked issues" sidebar.
            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 25) {
                      nodes { number }
                    }
                  }
                }
              }`;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber,
            });

            const issues =
              result.repository.pullRequest.closingIssuesReferences.nodes;

            if (issues.length === 0) {
              console.log(`PR #${prNumber}: no linked closing issues found.`);
            }

            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed issue #${issue.number} (linked to PR #${prNumber}).`);
            }
