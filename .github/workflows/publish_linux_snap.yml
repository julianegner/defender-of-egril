name: Publish Linux Snap

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish the snap from (e.g. v1.0.3). Defaults to the latest release."
        required: false
        type: string
      snap_channel:
        description: "Snap Store channel to publish to"
        required: false
        default: edge
        type: string
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the snap from (e.g. v1.0.3). Leave empty to use the latest release."
        required: false
        type: string
      snap_channel:
        description: "Snap Store channel to publish to"
        required: false
        type: choice
        default: edge
        options:
          - edge
          - beta
          - candidate
          - stable

permissions:
  contents: read

jobs:
  publish_linux_snap:
    name: Publish Linux Snap to Snap Store
    runs-on: ubuntu-latest

    steps:
      - name: Validate workflow inputs
        run: |
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -n "$RELEASE_TAG" ] && ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::release_tag must start with 'v<major>.<minor>.<patch>' (got '$RELEASE_TAG')."
            exit 1
          fi

          case "${{ inputs.snap_channel }}" in
            edge|beta|candidate|stable)
              ;;
            *)
              echo "::error::Unsupported snap_channel '${{ inputs.snap_channel }}'. Use one of: edge, beta, candidate, stable."
              exit 1
              ;;
          esac

      - name: Check Snap Store credentials
        id: check
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS}" ]; then
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS secret is not configured; skipping Snap Store publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download snap from GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snap-artifact
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release_tag provided; downloading snap from the latest release."
            gh release download --repo "${{ github.repository }}" --pattern "defender-of-egril_*.snap" --dir snap-artifact
          else
            echo "Downloading snap from release $RELEASE_TAG."
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "defender-of-egril_*.snap" --dir snap-artifact
          fi

      - name: Locate snap file
        if: steps.check.outputs.skip != 'true'
        id: locate
        run: |
          SNAP_FILE=$(find snap-artifact -maxdepth 1 -name '*.snap' -print -quit)
          if [ -z "$SNAP_FILE" ]; then
            echo "::error::No .snap file found in downloaded release assets."
            exit 1
          fi
          echo "Found snap file: $SNAP_FILE"
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish snap to Snap Store
        if: steps.check.outputs.skip != 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.locate.outputs.snap }}
          release: ${{ inputs.snap_channel }}
