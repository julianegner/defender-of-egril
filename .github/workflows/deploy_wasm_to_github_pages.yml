# Workflow for deploying WasmJS App to GitHub Pages
name: Deploy WasmJS App to GitHub Pages

on:
  #push:
  #  branches:
  #    - main  # Trigger the workflow on pushes to the main branch
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read        # Required to fetch the repository content
  pages: write          # Allow deployment to GitHub Pages
  id-token: write       # Required by actions/configure-pages

jobs:
  build-and-deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: "✅ Checkout code"
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 2. Set up JDK 24
      - name: "⚙️ Set up JDK 24"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      # 3. Set up Gradle
      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      # 4. Build the WasmJS App
      - name: "🛠️ Build WasmJS App"
        run: ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true

      # 5. Include APT repository content (served at /apt/ alongside the web app)
      - name: "📦 Include APT repository content"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WASM_OUTPUT=./frontend/composeApp/build/dist/wasmJs/productionExecutable
          APT_DEST="$WASM_OUTPUT/apt"

          if git ls-remote --heads origin apt-repo 2>/dev/null | grep -q "apt-repo"; then
            echo "apt-repo branch found; including APT repository content at apt/."
            git fetch origin apt-repo
            mkdir -p "$APT_DEST"
            git archive origin/apt-repo | tar -x -C "$APT_DEST"
            echo "APT repository content included."

            # The .deb binary is not stored in the apt-repo git branch (it exceeds
            # GitHub's 100 MB per-file limit).  Download it from the GitHub Release
            # that matches the Packages index and place it in the pool directory so
            # APT clients can fetch it from the Pages site.
            PACKAGES_FILE="$APT_DEST/dists/stable/main/binary-amd64/Packages"
            if [ -f "$PACKAGES_FILE" ]; then
              DEB_FILENAME=$(grep "^Filename:" "$PACKAGES_FILE" | head -1 | awk '{print $2}')
              if [ -n "$DEB_FILENAME" ]; then
                DEB_BASENAME=$(basename "$DEB_FILENAME")
                DEB_POOL_DIR="$APT_DEST/$(dirname "$DEB_FILENAME")"
                # Derive the release tag from the .deb filename (e.g. defender-of-egril_1.0.3_amd64.deb → v1.0.3)
                DEB_VERSION=$(echo "$DEB_BASENAME" | sed 's/defender-of-egril_\([^_]*\)_.*/\1/')
                RELEASE_TAG="v${DEB_VERSION}"
                mkdir -p "$DEB_POOL_DIR"
                echo "Downloading $DEB_BASENAME from release $RELEASE_TAG..."
                if gh release download "$RELEASE_TAG" \
                    --repo "${{ github.repository }}" \
                    --pattern "$DEB_BASENAME" \
                    --dir "$DEB_POOL_DIR" \
                    --clobber; then
                  echo "Downloaded $DEB_BASENAME to $DEB_POOL_DIR."
                else
                  echo "::warning::Could not download $DEB_BASENAME from release $RELEASE_TAG. Verify that the release exists and contains the .deb asset. APT pool will not contain the .deb binary."
                fi
              else
                echo "::warning::No Filename found in Packages index; skipping .deb download."
              fi
            else
              echo "::warning::Packages index not found; skipping .deb download."
            fi
          else
            echo "apt-repo branch not found; skipping APT repository content."
          fi

      # 6. Set up GitHub Pages
      - name: "📄 Configure GitHub Pages"
        uses: actions/configure-pages@v6
        with:
          enablement: true  # Automatically enable Pages if not already enabled

      # 7. Upload the built artifact to Pages
      - name: "📤 Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/composeApp/build/dist/wasmJs/productionExecutable

      # 8. Deploy to GitHub Pages
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
