# Workflow for deploying WasmJS App to GitHub Pages
name: Deploy WasmJS App to GitHub Pages

on:
  #push:
  #  branches:
  #    - main  # Trigger the workflow on pushes to the main branch
  workflow_dispatch:  # Allow manual triggering
    inputs:
      release_channel:
        description: "Which web release to deploy"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      beta_version:
        description: "Beta app version to publish under /beta (for example 1.2.3-beta). Required when release_channel=beta."
        required: false
        type: string

permissions:
  contents: read        # Required to fetch the repository content
  pages: write          # Allow deployment to GitHub Pages
  id-token: write       # Required by actions/configure-pages

jobs:
  build-and-deploy:
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: "✅ Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Set up JDK 24
      - name: "⚙️ Set up JDK 24"
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '24'

      # 3. Set up Gradle
      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      # 4. Build the WasmJS App
      - name: "🛠️ Build WasmJS App"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAGING_DIR="$RUNNER_TEMP/pages-site"
          RELEASE_CHANNEL="${{ github.event.inputs.release_channel }}"
          STABLE_WORKTREE="$RUNNER_TEMP/stable-site-src"
          BETA_WORKTREE="$RUNNER_TEMP/beta-site-src"
          EXISTING_BETA_DIR="$RUNNER_TEMP/existing-beta-site"
          if [ -z "$RELEASE_CHANNEL" ]; then
            RELEASE_CHANNEL="stable"
          fi

          cleanup_worktrees() {
            git worktree remove "$STABLE_WORKTREE" --force 2>/dev/null || true
            git worktree remove "$BETA_WORKTREE" --force 2>/dev/null || true
          }

          latest_beta_tag() {
            gh api repos/${{ github.repository }}/releases?per_page=100 | python -c '
              import json
              import re
              import sys

              beta_pattern = re.compile(r"^v?(\\d+)\\.(\\d+)\\.(\\d+)-beta(?:[.-](.*))?$", re.IGNORECASE)

              def beta_suffix_key(tag_suffix):
                  if not tag_suffix:
                      return ()
                  return tuple(
                      (0, int(token)) if token.isdigit() else (1, token.lower())
                      for token in re.split(r"[.-]", tag_suffix)
                      if token
                  )

              best_key = None
              best_tag = ""

              for release in json.load(sys.stdin):
                  if not release.get("prerelease"):
                      continue
                  tag = release.get("tag_name", "")
                  match = beta_pattern.match(tag)
                  if not match:
                      continue
                  key = (
                      int(match.group(1)),
                      int(match.group(2)),
                      int(match.group(3)),
                      beta_suffix_key(match.group(4)),
                  )
                  if best_key is None or key > best_key:
                      best_key = key
                      best_tag = tag

              print(best_tag)
              '
          }

          trap cleanup_worktrees EXIT

          rm -rf "$STAGING_DIR"
          rm -rf "$EXISTING_BETA_DIR"
          mkdir -p "$STAGING_DIR"

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            BETA_VERSION="${{ github.event.inputs.beta_version }}"
            if [ -z "$BETA_VERSION" ]; then
              echo "::error::beta_version is required when release_channel=beta."
              exit 1
            fi

            STABLE_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || true)
            if [ -z "$STABLE_TAG" ]; then
              echo "No stable release found yet; building production root from the current checkout."
              ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true
              cp -R ./frontend/composeApp/build/dist/wasmJs/productionExecutable/. "$STAGING_DIR/"
            else
              echo "Building stable site from $STABLE_TAG for production root."
              git worktree add "$STABLE_WORKTREE" "$STABLE_TAG"
              (
                cd "$STABLE_WORKTREE" &&
                  ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true
              )
              cp -R "$STABLE_WORKTREE/frontend/composeApp/build/dist/wasmJs/productionExecutable/." "$STAGING_DIR/"
            fi

            echo "Building beta site for /beta using version $BETA_VERSION."
            ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true -PappVersion="$BETA_VERSION"
            mkdir -p "$STAGING_DIR/beta"
            cp -R ./frontend/composeApp/build/dist/wasmJs/productionExecutable/. "$STAGING_DIR/beta/"
          else
            echo "Building stable site for production root."
            ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true
            cp -R ./frontend/composeApp/build/dist/wasmJs/productionExecutable/. "$STAGING_DIR/"

            LATEST_BETA_TAG="$(latest_beta_tag)"
            if [ -n "$LATEST_BETA_TAG" ]; then
              echo "Preserving beta site from $LATEST_BETA_TAG under /beta."
              git worktree add "$BETA_WORKTREE" "$LATEST_BETA_TAG"
              (
                cd "$BETA_WORKTREE" &&
                  ./gradlew :composeApp:wasmJsBrowserDistribution -PwithImpressum=true -PappVersion="${LATEST_BETA_TAG#v}"
              )
              mkdir -p "$STAGING_DIR/beta"
              cp -R "$BETA_WORKTREE/frontend/composeApp/build/dist/wasmJs/productionExecutable/." "$STAGING_DIR/beta/"
            else
              echo "No beta release found; attempting to preserve the currently published /beta content."
              if wget --mirror --no-verbose --directory-prefix "$EXISTING_BETA_DIR" https://defender.egril.de/beta/; then
                EXISTING_BETA_PATH="$EXISTING_BETA_DIR/defender.egril.de/beta"
                if [ -d "$EXISTING_BETA_PATH" ]; then
                  mkdir -p "$STAGING_DIR/beta"
                  cp -R "$EXISTING_BETA_PATH/." "$STAGING_DIR/beta/"
                  echo "Preserved existing published /beta content."
                else
                  echo "Published /beta path was not found in mirrored content; skipping beta preservation."
                fi
              else
                echo "::warning::Could not mirror the currently published /beta content; stable deployment will proceed without /beta."
              fi
            fi
          fi

      # 5. Include APT repository content (served at /apt/ alongside the web app)
      - name: "📦 Include APT repository content"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WASM_OUTPUT="$RUNNER_TEMP/pages-site"
          APT_DEST="$WASM_OUTPUT/apt"

          if git ls-remote --heads origin apt-repo 2>/dev/null | grep -q "apt-repo"; then
            echo "apt-repo branch found; including APT repository content at apt/."
            git fetch origin apt-repo
            mkdir -p "$APT_DEST"
            git archive origin/apt-repo | tar -x -C "$APT_DEST"
            echo "APT repository content included."

            # The .deb binary is not stored in the apt-repo git branch (it exceeds
            # GitHub's 100 MB per-file limit). Download each .deb referenced by a
            # published Packages index and place it in the pool directory so APT
            # clients can fetch it from the Pages site.
            PACKAGES_FILES=$(find "$APT_DEST/dists" -path '*/main/binary-amd64/Packages' -type f)
            if [ -n "$PACKAGES_FILES" ]; then
              echo "$PACKAGES_FILES" | while read -r PACKAGES_FILE; do
                [ -n "$PACKAGES_FILE" ] || continue
                DEB_FILENAME=$(grep "^Filename:" "$PACKAGES_FILE" | head -1 | awk '{print $2}')
                if [ -n "$DEB_FILENAME" ]; then
                  DEB_BASENAME=$(basename "$DEB_FILENAME")
                  DEB_POOL_DIR="$APT_DEST/$(dirname "$DEB_FILENAME")"
                  # Derive the release tag from the .deb filename
                  # (e.g. defender-of-egril_1.0.3_amd64.deb → v1.0.3)
                  DEB_NO_PREFIX="${DEB_BASENAME#defender-of-egril_}"
                  DEB_VERSION="${DEB_NO_PREFIX%%_*}"
                  RELEASE_TAG="v${DEB_VERSION}"
                  mkdir -p "$DEB_POOL_DIR"
                  echo "Downloading $DEB_BASENAME from release $RELEASE_TAG..."
                  if gh release download "$RELEASE_TAG" \
                      --repo "${{ github.repository }}" \
                      --pattern "$DEB_BASENAME" \
                      --dir "$DEB_POOL_DIR" \
                      --clobber; then
                    echo "Downloaded $DEB_BASENAME to $DEB_POOL_DIR."
                  else
                    echo "::warning::Could not download $DEB_BASENAME from release"
                    echo "::warning::$RELEASE_TAG. Verify that the release exists"
                    echo "::warning::and contains the .deb asset. APT pool will"
                    echo "::warning::not contain the .deb binary."
                  fi
                else
                  echo "::warning::No Filename found in $PACKAGES_FILE;"
                  echo "::warning::skipping .deb download."
                fi
              done
            else
              echo "::warning::Packages index not found; skipping .deb download."
            fi
          else
            echo "apt-repo branch not found; skipping APT repository content."
          fi

      # 6. Set up GitHub Pages
      - name: "📄 Configure GitHub Pages"
        uses: actions/configure-pages@v6
        with:
          enablement: true  # Automatically enable Pages if not already enabled

      # 7. Upload the built artifact to Pages
      - name: "📤 Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

      # 8. Deploy to GitHub Pages
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
