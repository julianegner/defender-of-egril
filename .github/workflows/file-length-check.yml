name: File Length Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-length:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production Kotlin file lengths
        run: .github/scripts/check-file-length.sh
