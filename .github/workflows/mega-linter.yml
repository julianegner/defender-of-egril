---
name: MegaLinter

# Run on every push to main and on all pull requests targeting main.
# More info at https://megalinter.io
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Allow MegaLinter to post status checks
  contents: read
  statuses: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Full history so MegaLinter can compare against the target branch
          fetch-depth: 0

      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        id: ml
        env:
          # Validate all sources when pushing to main; only changed files for PRs
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main'
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
