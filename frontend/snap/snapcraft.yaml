name: defender-of-egril
title: Defender of Egril
base: core22
# version is injected by CI via --snap-option version=<ver>; keep a default for local builds
version: '1.0.0'
summary: Defender of Egril – Turn-based Tower Defense
description: |
  A turn-based tower defense game built with Kotlin Multiplatform and
  Compose Multiplatform. Defend the realm of Egril against waves of
  monsters by placing towers, casting spells, set traps and place barricades.
icon: gui/icon.png
license: AGPL-3.0

grade: stable
confinement: strict
compression: lzo

# Bind-mount the staged fontconfig configuration inside the snap so that the
# bundled JVM can locate fonts even under strict confinement.
layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts

# The DEB produced by Compose Desktop already bundles a JRE and native
# libraries, so we simply extract it into the snap root.
parts:
  app:
    plugin: dump
    source: deb
    source-type: local
    build-packages:
      - zstd
    override-build: |
      DEB=$(ls "$CRAFT_PART_SRC"/*.deb 2>/dev/null | head -1)
      if [ -z "$DEB" ]; then
        echo "No .deb file found in source directory ($CRAFT_PART_SRC)"
        exit 1
      fi
      echo "Extracting DEB: $DEB"
      TMP=$(mktemp -d)
      DEBABS=$(realpath "$DEB")
      (cd "$TMP" && ar x "$DEBABS")
      for f in "$TMP"/data.tar.*; do
        tar xaf "$f" -C "$CRAFT_PART_INSTALL"
      done
      echo "Installed files:"
      find "$CRAFT_PART_INSTALL" -maxdepth 4 -type f | sed "s|$CRAFT_PART_INSTALL/||" | sort | head -200

      # Create usr/bin wrapper pointing to the actual launcher from the DEB payload.
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      printf '#!/bin/sh\nexec "$SNAP/opt/defender-of-egril/bin/DefenderOfEgril" "$@"\n' \
        > "$CRAFT_PART_INSTALL/usr/bin/defender-of-egril"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/defender-of-egril"

      rm -rf "$TMP"
    stage-packages:
      # Font rendering – the JVM font manager (libfontmanager.so) requires
      # libfreetype and libfontconfig.  The 'fontconfig' package adds the
      # configuration files (/etc/fonts/fonts.conf …) that libfontconfig needs;
      # without them the JVM cannot load any fonts and will crash on startup.
      - libfreetype6
      - libfontconfig1
      - fontconfig
      - fonts-dejavu-core
      # X11 display libraries required by the JVM's AWT X toolkit
      # (libawt_xawt.so links against all of these at runtime).
      - libx11-6
      - libxext6
      - libxrender1
      - libxi6
      - libxtst6
      # ALSA audio library – required by the audio-playback snap interface.
      # Both libasound2 and libasound2-data are listed explicitly so that
      # rebuilding the snap picks up security updates (e.g. USN 8538-1).
      - libasound2
      - libasound2-data

apps:
  defender-of-egril:
    command: usr/bin/defender-of-egril

    environment:
      HOME: $SNAP_USER_DATA
      JAVA_HOME: $SNAP/opt/defender-of-egril/lib/runtime
      # Point the JVM font manager to the fontconfig configuration staged
      # inside the snap (bound to /etc/fonts via the layout section above).
      FONTCONFIG_PATH: $SNAP/etc/fonts
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
    plugs:
      - home
      - network
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - opengl
      - audio-playback
      - unity7
