#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8g"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
# TODO: The two properties above are temporary AGP 9.x compatibility bypasses.
# AGP 9.0+ no longer supports combining com.android.application with
# org.jetbrains.kotlin.multiplatform in the same subproject.
# The recommended migration is to move com.android.application into a separate
# Android-only subproject that depends on the KMP library subproject.
# See https://kotl.in/kmp-project-structure-migration for the migration guide.
# These flags will be removed in AGP 10.0 and must be addressed before then.

#Compose
org.jetbrains.compose.experimental.wasm.enabled=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Impressum flag (set to true to enable impressum on WASM platform)
withImpressum=false
